<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #e0d8e3, #f4f1f4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin: 10px 0 20px 0;
            color: #666;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin: 15px 0;
            color: #777;
            font-size: 18px;
            font-weight: normal;
            line-height: 1.4;
            max-width: 600px;
        }

        .logo-container {
            margin: 10px 0 20px 0;
        }

        .logo-container img {
            max-width: 400px;
            height: auto;
            width: 100%;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            color: white;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            min-width: 160px;
        }

        #cancelBtn {
            background-color: #e74c3c;
        }

        #cancelBtn:hover {
            background-color: #c0392b;
        }

        #whitelistBtn {
            background-color: #9b59b6;
        }

        #whitelistBtn:hover {
            background-color: #73368d;
        }

        #siteInfo {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: rgba(155, 89, 182, 0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #7145c7;
            max-width: 500px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>ScholarTime Has Blocked This Page!</h1>
    <h3>It seems like you've tried to open a service that isn't permitted.</h3>
    
    <div class="logo-container">
        <img src="icons/ScholarTime Larger Transparent Logo.png" alt="ScholarTime Logo">
    </div>
    
    <h3>You can either go back to your previous page, or add this site to your whitelist to access it.</h3>
    
    <div id="siteInfo" class="hidden">
        Attempting to access: <span id="blockedSiteUrl">Loading...</span>
    </div>
    
    <div class="button-container">
        <button id="cancelBtn">Go Back</button>
        <button id="whitelistBtn">Add to Whitelist & Continue</button>
    </div>
    
    <script src="forbidden.js"></script>
</body>
</html>
