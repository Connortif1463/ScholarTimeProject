<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarTime Settings</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <!-- ScholarTime Settings Title -->
    <h3 class="settings-title">ScholarTime Settings</h3>
    <h8>[refresh to apply]</h8>

    <!-- On Off Switch -->
    <div class="switches">
        <h3>On/Off</h3>
        <!-- Rounded switch -->
        <label class="switch">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider round"></span>
        </label>
    </div>
    
</body>
</html>
