<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarTime Settings</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <!-- ScholarTime Settings Title -->
    <img src="icons/ScholarTime Large Transparent Logo.png">
    <subtitle1>(refresh to apply settings)</subtitle1>

    <!-- Off/On Section -->
    <h3>Off / On</h3>
    <div class="switches">
        <label class="switch">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider round"></span>
        </label>
    </div>

    <!-- Whitelist Section -->
    <div class="whitelist-section">
        <!-- Dropdown for Whitelist -->
        <div class="dropdown">
            <button class="dropbtn">View Whitelist (0 sites)</button>
                <div class="dropdown-content" id="whitelistDropdown">
                    <!-- Combined Search/Add Input -->
                    <div class="search-add-container">
                        <input type="text" 
                            id="searchAddInput" 
                            placeholder="Search or add page, ex: youtube.com">
                        <button id="addFromSearchBtn" class="add-btn">Add "example.com"</button>
                    </div>
                    
                    <!-- Results/Whitelist Items -->
                    <div id="whitelistItemsContainer">
                        <div id="whitelistItems"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
